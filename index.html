<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブロック崩し</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1220;
      color: #e8ecf5;
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      max-height: calc(100vh - 80px);
      aspect-ratio: 480 / 640;
      object-fit: contain;
      background: #161a2e;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      touch-action: none;
      cursor: none;
    }
    .help {
      margin: 0;
      font-size: 13px;
      color: #8a93b0;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>
  <p class="help">← → / マウス / タッチで移動 ・ スペース or クリックで発射 ・ P で一時停止</p>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      // ---- 設定 ----
      const COLS = 8;
      const ROWS = 5;
      const BRICK_GAP = 6;
      const BRICK_TOP = 80;
      const BRICK_SIDE = 16;
      const BRICK_H = 20;
      const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
      const ROW_COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff'];
      const ROW_POINTS = [50, 40, 30, 20, 10];

      const PADDLE_W = 84;
      const PADDLE_H = 12;
      const PADDLE_Y = H - 48;
      const PADDLE_SPEED = 520; // px/s

      const BALL_R = 7;
      const BALL_SPEED_START = 340; // px/s
      const BALL_SPEED_MAX = 620;
      const BALL_SPEED_UP = 6; // ブロック破壊ごとの加速

      // ---- 状態 ----
      let state;      // 'ready' | 'playing' | 'paused' | 'over' | 'clear'
      let score, lives, bricks;
      const paddle = { x: (W - PADDLE_W) / 2 };
      const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: BALL_SPEED_START };
      const keys = { left: false, right: false };

      function buildBricks() {
        bricks = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            bricks.push({
              x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
              y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
              color: ROW_COLORS[r],
              points: ROW_POINTS[r],
              alive: true,
            });
          }
        }
      }

      function resetBall() {
        ball.speed = BALL_SPEED_START;
        ball.vx = 0;
        ball.vy = 0;
        stickBallToPaddle();
      }

      function stickBallToPaddle() {
        ball.x = paddle.x + PADDLE_W / 2;
        ball.y = PADDLE_Y - BALL_R - 1;
      }

      function newGame() {
        score = 0;
        lives = 3;
        buildBricks();
        paddle.x = (W - PADDLE_W) / 2;
        resetBall();
        state = 'ready';
      }

      function launch() {
        // 少し斜め上に発射
        const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        state = 'playing';
      }

      // スペース / クリック / タップ共通のアクション
      function action() {
        if (state === 'ready') launch();
        else if (state === 'paused') state = 'playing';
        else if (state === 'over' || state === 'clear') newGame();
      }

      // ---- 入力 ----
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        else if (e.key === 'ArrowRight') keys.right = true;
        else if (e.key === ' ') { e.preventDefault(); action(); }
        else if (e.key === 'p' || e.key === 'P') {
          if (state === 'playing') state = 'paused';
          else if (state === 'paused') state = 'playing';
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        else if (e.key === 'ArrowRight') keys.right = false;
      });

      // 表示サイズ → Canvas 内部座標へ変換
      function toCanvasX(clientX) {
        const rect = canvas.getBoundingClientRect();
        return (clientX - rect.left) * (W / rect.width);
      }
      function movePaddleTo(x) {
        paddle.x = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
      }

      canvas.addEventListener('pointermove', (e) => movePaddleTo(toCanvasX(e.clientX)));
      canvas.addEventListener('pointerdown', (e) => {
        movePaddleTo(toCanvasX(e.clientX));
        action();
      });

      // ---- 更新 ----
      function update(dt) {
        // パドル（キーボード）
        if (keys.left) paddle.x -= PADDLE_SPEED * dt;
        if (keys.right) paddle.x += PADDLE_SPEED * dt;
        paddle.x = Math.max(0, Math.min(W - PADDLE_W, paddle.x));

        if (state === 'ready') {
          stickBallToPaddle();
          return;
        }
        if (state !== 'playing') return;

        // すり抜け防止のため細かく分割して移動
        const steps = Math.ceil((ball.speed * dt) / (BALL_R * 0.8));
        const sdt = dt / steps;
        for (let i = 0; i < steps && state === 'playing'; i++) {
          stepBall(sdt);
        }
      }

      function stepBall(dt) {
        // X 方向
        ball.x += ball.vx * dt;
        if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
        if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
        if (hitBrick()) ball.vx = -ball.vx, ball.x += ball.vx * dt;

        // Y 方向
        ball.y += ball.vy * dt;
        if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
        if (hitBrick()) ball.vy = -ball.vy, ball.y += ball.vy * dt;

        // パドル
        if (
          ball.vy > 0 &&
          ball.y + BALL_R >= PADDLE_Y &&
          ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 8 &&
          ball.x >= paddle.x - BALL_R &&
          ball.x <= paddle.x + PADDLE_W + BALL_R
        ) {
          // 当たった位置で反射角を変える（-1:左端 〜 1:右端）
          const hit = (ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
          const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3); // 最大 60°
          ball.vx = Math.sin(angle) * ball.speed;
          ball.vy = -Math.cos(angle) * ball.speed;
          ball.y = PADDLE_Y - BALL_R;
        }

        // 落下
        if (ball.y - BALL_R > H) {
          lives--;
          if (lives <= 0) {
            state = 'over';
          } else {
            resetBall();
            state = 'ready';
          }
        }
      }

      // ボールと重なったブロックを1つ壊して true を返す
      function hitBrick() {
        for (const b of bricks) {
          if (!b.alive) continue;
          const nx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
          const ny = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
          const dx = ball.x - nx;
          const dy = ball.y - ny;
          if (dx * dx + dy * dy <= BALL_R * BALL_R) {
            b.alive = false;
            score += b.points;
            speedUp();
            if (bricks.every((br) => !br.alive)) state = 'clear';
            return true;
          }
        }
        return false;
      }

      function speedUp() {
        ball.speed = Math.min(BALL_SPEED_MAX, ball.speed + BALL_SPEED_UP);
        const len = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / len) * ball.speed;
        ball.vy = (ball.vy / len) * ball.speed;
      }

      // ---- 描画 ----
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // HUD
        ctx.fillStyle = '#e8ecf5';
        ctx.font = 'bold 18px system-ui, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE ${score}`, 16, 32);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ff5d73';
        ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 16, 32);

        // ブロック
        for (const b of bricks) {
          if (!b.alive) continue;
          ctx.fillStyle = b.color;
          roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
          ctx.fill();
        }

        // パドル
        ctx.fillStyle = '#e8ecf5';
        roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
        ctx.fill();

        // ボール
        if (state !== 'over') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
          ctx.fill();
        }

        // メッセージ
        if (state === 'ready') {
          message('スペース / クリックで発射');
        } else if (state === 'paused') {
          overlay('PAUSE', 'P / クリックで再開');
        } else if (state === 'over') {
          overlay('GAME OVER', `SCORE ${score} ・ クリックでリトライ`);
        } else if (state === 'clear') {
          overlay('CLEAR!', `SCORE ${score} ・ クリックでもう一度`);
        }
      }

      function message(text) {
        ctx.fillStyle = '#8a93b0';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(text, W / 2, H * 0.62);
      }

      function overlay(title, sub) {
        ctx.fillStyle = 'rgba(15, 18, 32, 0.75)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px system-ui, sans-serif';
        ctx.fillText(title, W / 2, H / 2 - 16);
        ctx.fillStyle = '#c3c9dc';
        ctx.font = '16px system-ui, sans-serif';
        ctx.fillText(sub, W / 2, H / 2 + 28);
      }

      // ---- ループ ----
      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - last) / 1000); // タブ復帰時の大ジャンプ防止
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      newGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
